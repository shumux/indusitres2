<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAH INDUSTRIES</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        h1 {
            font-size: 48px;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 80px;
            border-bottom: 1px solid #000;
            display: inline-block;
            padding-bottom: 10px;
        }
        .grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            border: 1px solid #000;
            padding: 40px 20px;
            width: 250px;
            text-decoration: none;
            color: #000;
            transition: 0.3s;
        }
        .card:hover {
            background-color: #000;
            color: #fff;
        }
        .card h2 {
            font-size: 24px;
            margin-top: 0;
            letter-spacing: 2px;
        }
        .card p {
            font-size: 14px;
            color: #666;
        }
        .card:hover p {
            color: #ccc;
        }
        .footer {
            margin-top: 100px;
            font-size: 12px;
            color: #999;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>ZAH INDUSTRIES</h1>
    <div class="subtitle">Группа компаний</div>

    <div class="grid">
        <a href="#" class="card">
            <h2>ZahSales</h2>
            <p>Торговля и продажи</p>
        </a>
        <a href="#" class="card">
            <h2>ZahDigital</h2>
            <p>Разработка ботов и сайтов</p>
        </a>
        <a href="#" class="card">
            <h2>ZahMedia</h2>
            <p>YouTube-канал</p>
        </a>
    </div>

    <div class="footer">
        © 2026 Zah Industries
    </div>

</body>
</html>
