<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAH INDUSTRIES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .logo {
            width: 220px;
            height: auto;
            display: block;
            margin: 0 auto 25px;
        }

        .title {
            font-family: "Times New Roman", Times, serif;
            font-size: 40px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #333333;
            letter-spacing: 1px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
            padding: 40px 20px 50px;
            max-width: 980px;
            width: 100%;
            flex-grow: 1;
        }

        .card {
            border: 1px solid #000000;
            padding: 32px 24px;
            width: 260px;
            text-align: center;
        }

        .card h2 {
            font-family: "Times New Roman", Times, serif;
            font-size: 22px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .card p {
            font-size: 15px;
            line-height: 1.45;
            color: #222222;
        }

        .footer {
            text-align: center;
            padding: 25px 20px 40px;
            font-size: 13px;
            color: #555555;
        }
    </style>
</head>
